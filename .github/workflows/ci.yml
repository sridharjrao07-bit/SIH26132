name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUN_SCHEDULER: "0"
  RATE_LIMIT_ENABLED: "0"
  APP_ENV: development
  SUPABASE_URL: https://placeholder.supabase.co
  SUPABASE_ANON_KEY: placeholder
  SUPABASE_SERVICE_ROLE_KEY: placeholder
  SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret-32b-min
  SUPABASE_DB_URL: postgresql://p@db.placeholder.supabase.co:5432/postgres
  DATA_GOV_IN_API_KEY: placeholder

jobs:
  commit-hygiene:
    name: commit hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Check commit dates and emails
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch push, check only the new commit
            RANGE="HEAD^..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          
          for c in $(git rev-list "$RANGE"); do
            ad=$(git log -1 --format="%at" $c)
            cd=$(git log -1 --format="%ct" $c)
            email=$(git log -1 --format="%ae" $c)
            diff=$((ad-cd))
            if [ ${diff#-} -gt 86400 ]; then
              echo "::error::Commit $c has author date differing from committer date by more than a day."
              exit 1
            fi
            if ! grep -qxiF "$email" .github/allowed-authors; then
              echo "::error::Commit $c has unapproved author email: $email"
              exit 1
            fi
          done

  test-db:
    name: database integration (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: krishi_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/krishi_test
      ENABLE_DB_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with: { python-version: "3.12", allow-prereleases: true }
      - run: pip install -r requirements-dev.txt
      - run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f db/ci_bootstrap.sql
      - run: python scripts/apply_migrations.py
      - run: pytest -m db -q --strict-markers -rs | tee db.log
      - run: grep -qE "[1-9][0-9]* skipped" db.log && { echo "::error::db job must not skip"; exit 1; } || true
      - run: pytest tests/test_privileges.py tests/test_db_rpc.py -q --strict-markers -rs | tee priv.log
      - run: grep -qE "[1-9][0-9]* skipped" priv.log && { echo "::error::db job must not skip"; exit 1; } || true

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"
          allow-prereleases: true
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .

  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Pytest
        run: |
          pytest -rs | tee test.log
          # Fail on any skip reason we have not explicitly accepted.
          unexpected="$(grep -E '^SKIPPED' test.log \
            | sed 's/.*py:[0-9]*: //' | sort -u \
            | grep -vFf ci/allowed-skips.txt || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::unaccepted skip reasons:"; echo "$unexpected"; exit 1
          fi

  test-ml:
    name: test-ml (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Install ML deps
        run: pip install -r requirements-forecast-ml.txt
      - name: Pytest
        run: pytest

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"
          allow-prereleases: true
      - name: Install pip-audit
        run: pip install "pip-audit==2.9.0"
      - name: pip-audit (production lock)
        run: pip-audit -r requirements.txt -r requirements-forecast-ml.txt
      - name: Secret patterns
        run: |
          # Character classes so this workflow file does not match itself.
          if git grep -I -E 'sk[_]live_|ghp[_][A-Za-z0-9]{20,}|supabase[_]service[_]role[_]eyJ' \
            -- ':!.env.example' ':!docs/archive/**' ':!.github/workflows/**'; then
            echo "Possible secret in the tree" >&2
            exit 1
          fi
          echo "no obvious secrets"
      - name: Gitleaks history scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
