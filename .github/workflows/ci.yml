name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUN_SCHEDULER: "0"
  RATE_LIMIT_ENABLED: "0"
  APP_ENV: development
  SUPABASE_URL: https://placeholder.supabase.co
  SUPABASE_ANON_KEY: placeholder
  SUPABASE_SERVICE_ROLE_KEY: placeholder
  SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret-32b-min
  SUPABASE_DB_URL: postgresql://p@db.placeholder.supabase.co:5432/postgres
  DATA_GOV_IN_API_KEY: placeholder

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app ingestion forecasting notifications tests demo scripts

  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest -q

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install pip-audit
        run: pip install "pip-audit==2.9.0"
      - name: pip-audit (production lock)
        run: pip-audit -r requirements.txt -r requirements-forecast-ml.txt
      - name: Secret patterns
        run: |
          # Character classes so this workflow file does not match itself.
          if git grep -I -E 'sk[_]live_|ghp[_][A-Za-z0-9]{20,}|supabase[_]service[_]role[_]eyJ' \
            -- ':!.env.example' ':!docs/archive/**' ':!.github/workflows/**'; then
            echo "Possible secret in the tree" >&2
            exit 1
          fi
          echo "no obvious secrets"
      - name: Gitleaks history scan (mirror)
        run: |
          git clone --mirror https://github.com/${{ github.repository }}.git repo-mirror
          docker run -v $(pwd)/repo-mirror:/repo ghcr.io/gitleaks/gitleaks:latest detect --source="/repo" --verbose
