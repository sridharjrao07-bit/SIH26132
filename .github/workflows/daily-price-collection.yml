name: daily government price collection

on:
  workflow_dispatch:
  schedule:
    # 10:00 IST (04:30 UTC), after the current mandi snapshot is published.
    - cron: "30 4 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@337b0725b8770380d7cde73cfef696f1295727eb
        with:
          python-version: "3.12"
      - name: Check collection credentials
        id: credentials
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$DATA_GOV_IN_API_KEY" || -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Daily collection skipped because one or more repository secrets are not configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install runtime dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Collect current Onion prices
        if: steps.credentials.outputs.ready == 'true'
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/collect_daily_prices.py
